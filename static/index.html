<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文打字競速</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="banner" class="hidden">連線中斷，正在重新連線…</div>
  <div id="toast" class="hidden"></div>

  <div class="app">
    <header class="brand">
      <h1>中文打字競速</h1>
      <span class="beta">測試版</span>
    </header>

    <!-- 畫面 1：進入 -->
    <section id="screen-home" class="card">
      <div class="field">
        <label for="nickname-input">你的暱稱</label>
        <input id="nickname-input" type="text" maxlength="12" placeholder="例如：小明" autocomplete="off">
      </div>

      <button id="create-btn">建立房間</button>

      <div class="divider">或加入朋友的房間</div>

      <div class="field">
        <label for="room-code-input">房號</label>
        <input id="room-code-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
      </div>

      <button id="join-btn" class="secondary">加入房間</button>

      <div id="home-error" class="error hidden"></div>
    </section>

    <!-- 畫面 2：Lobby -->
    <section id="screen-lobby" class="card hidden">
      <div class="room-code-box">
        <div class="room-code-label">房號</div>
        <div class="room-code" id="room-code-display">----</div>
        <button id="copy-btn" class="secondary">複製邀請連結</button>
      </div>

      <div class="section-head">
        <span>玩家</span>
        <span id="player-count">0 / 8</span>
      </div>
      <ul class="player-list" id="player-list"></ul>

      <div class="field hidden" id="category-field">
        <label for="category-select">文章分類</label>
        <select id="category-select"></select>
      </div>

      <p class="hint category-note hidden" id="category-note"></p>

      <details id="custom-text-box" class="custom-box hidden">
        <summary>自訂文章（留空則從上面的分類隨機抽）</summary>
        <textarea id="custom-text" rows="4" placeholder="貼上想比的文章，約 100 字最剛好"></textarea>
        <div class="counter"><span id="custom-count">0</span> 字</div>
      </details>

      <button id="start-btn">開始遊戲</button>
      <p class="hint" id="lobby-hint"></p>

      <button id="leave-btn" class="leave">離開房間</button>
    </section>

    <!-- 畫面 3：比賽 -->
    <section id="screen-race" class="card hidden">
      <div class="race-head">
        <div class="metric"><span id="race-timer">0.0</span><small>秒</small></div>
        <div class="metric right"><span id="race-progress">0 / 0</span><small>字</small></div>
      </div>

      <div id="article" class="article"><span id="art-done"></span><span id="art-cursor"></span><span id="art-rest"></span></div>

      <textarea id="typing-input" rows="3" placeholder="倒數結束後開始輸入…"
                autocomplete="off" autocapitalize="off" spellcheck="false" disabled></textarea>
      <p class="hint" id="typing-hint"></p>

      <ul class="progress-list" id="progress-list"></ul>
      <p class="hint" id="grace-hint"></p>

      <div id="countdown" class="countdown hidden"><span id="countdown-number">3</span></div>
    </section>

    <!-- 畫面 4：結果 -->
    <section id="screen-result" class="card hidden">
      <h2 class="result-title">比賽結果</h2>
      <ol class="result-list" id="result-list"></ol>
      <button id="again-btn">再來一局</button>
      <p class="hint" id="result-hint"></p>
      <button id="leave-btn-2" class="leave">離開房間</button>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
