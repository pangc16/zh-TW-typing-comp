<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文打字競速</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1d21;
      --muted: #6b7280;
      --accent: #2563eb;
      --line: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1d2026;
        --text: #e8eaed;
        --muted: #9aa1ab;
        --accent: #60a5fa;
        --line: #2c3038;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .note {
      margin: 28px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>中文打字競速</h1>
    <p class="sub">多人連線 · 比正確 · 比速度</p>

    <div class="status">
      <span class="dot"></span>
      <span>伺服器運作中</span>
    </div>

    <p class="note">
      部署測試頁面<br>
      看到這一頁，代表整條部署路線已經打通。
    </p>
  </main>
</body>
</html>
